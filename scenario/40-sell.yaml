# Additive sell leg: three-customer SO -> ship -> invoice release (no AR pay).
# Warm re-runnable (document numbers change; per-leg deltas hold).
# AR collection is scenario/45-collect.yaml (mixed full / partial / open).
#
# Deltas:
#   sales: ACMEMFG 4x EDGE 1196 + NORTHGRID 3x CELL + 2x RAIL 2045
#     + AGRISENSE 3x EDGE 897 = 4138 revenue; COGS 7x139 + 3x195 + 2x145 = 1848
#   invoices released Open; AR 11000 +4138; cash 10100 +0 (no collect here)
#   inventory: EDGE -7, CELL -3, RAIL -2
# Requires on-hand kits from scenario/30-build.yaml (or equivalent).
scenario: sell
description: Sell pack (SO ship invoice) for ACMEMFG NORTHGRID AGRISENSE
steps:
# ---- sell: ACMEMFG (COD; collect in 45-collect) -----------------------
- id: so-acme
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: ACMEMFG
    Hold: false
    Details:
    - {InventoryID: GW-EDGE, OrderQty: 4, WarehouseID: WH01}
  capture: {OrderNbr: so_acme}
- id: ship-acme
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_acme}"}
  parameters: {WarehouseID: WH01}
- id: shipnbr-acme
  get:
    entity: SalesOrder
    keys: [SO, "${so_acme}"]
    expand: [Shipments]
  capture:
    Shipments[0].ShipmentNbr: ship_acme
- id: confirm-acme
  action: {entity: Shipment, name: ConfirmShipment}
  record: {ShipmentNbr: "${ship_acme}"}
  wait:
    entity: Shipment
    keys: ["${ship_acme}"]
    until: {Status: Confirmed}
- id: prepare-acme
  action: {entity: Shipment, name: PrepareInvoice}
  record: {ShipmentNbr: "${ship_acme}"}
- id: invnbr-acme
  get:
    entity: SalesOrder
    keys: [SO, "${so_acme}"]
    expand: [Shipments]
  capture:
    Shipments[0].InvoiceNbr: inv_acme
- id: release-inv-acme
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${inv_acme}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_acme}"]
    until: {Status: Open}
# ---- sell: NORTHGRID (NET30; collect partial in 45-collect) -----------
- id: so-northgrid
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: NORTHGRID
    Hold: false
    Details:
    - {InventoryID: GW-CELL, OrderQty: 3, WarehouseID: WH01}
    - {InventoryID: GW-RAIL, OrderQty: 2, WarehouseID: WH01}
  capture: {OrderNbr: so_northgrid}
- id: ship-northgrid
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_northgrid}"}
  parameters: {WarehouseID: WH01}
- id: shipnbr-northgrid
  get:
    entity: SalesOrder
    keys: [SO, "${so_northgrid}"]
    expand: [Shipments]
  capture:
    Shipments[0].ShipmentNbr: ship_northgrid
- id: confirm-northgrid
  action: {entity: Shipment, name: ConfirmShipment}
  record: {ShipmentNbr: "${ship_northgrid}"}
  wait:
    entity: Shipment
    keys: ["${ship_northgrid}"]
    until: {Status: Confirmed}
- id: prepare-northgrid
  action: {entity: Shipment, name: PrepareInvoice}
  record: {ShipmentNbr: "${ship_northgrid}"}
- id: invnbr-northgrid
  get:
    entity: SalesOrder
    keys: [SO, "${so_northgrid}"]
    expand: [Shipments]
  capture:
    Shipments[0].InvoiceNbr: inv_northgrid
- id: release-inv-northgrid
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${inv_northgrid}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_northgrid}"]
    until: {Status: Open}
# ---- sell: AGRISENSE (NET30; leave open — no collect step) ------------
- id: so-agrisense
  put: SalesOrder
  record:
    OrderType: SO
    CustomerID: AGRISENSE
    Hold: false
    Details:
    - {InventoryID: GW-EDGE, OrderQty: 3, WarehouseID: WH01}
  capture: {OrderNbr: so_agrisense}
- id: ship-agrisense
  action: {entity: SalesOrder, name: SalesOrderCreateShipment}
  record: {OrderType: SO, OrderNbr: "${so_agrisense}"}
  parameters: {WarehouseID: WH01}
- id: shipnbr-agrisense
  get:
    entity: SalesOrder
    keys: [SO, "${so_agrisense}"]
    expand: [Shipments]
  capture:
    Shipments[0].ShipmentNbr: ship_agrisense
- id: confirm-agrisense
  action: {entity: Shipment, name: ConfirmShipment}
  record: {ShipmentNbr: "${ship_agrisense}"}
  wait:
    entity: Shipment
    keys: ["${ship_agrisense}"]
    until: {Status: Confirmed}
- id: prepare-agrisense
  action: {entity: Shipment, name: PrepareInvoice}
  record: {ShipmentNbr: "${ship_agrisense}"}
- id: invnbr-agrisense
  get:
    entity: SalesOrder
    keys: [SO, "${so_agrisense}"]
    expand: [Shipments]
  capture:
    Shipments[0].InvoiceNbr: inv_agrisense
- id: release-inv-agrisense
  action: {entity: SalesInvoice, name: ReleaseSalesInvoice}
  record: {Type: Invoice, ReferenceNbr: "${inv_agrisense}"}
  wait:
    entity: SalesInvoice
    keys: [Invoice, "${inv_agrisense}"]
    until: {Status: Open}
expect:
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_acme}"]
  fields:
    Status: Open
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_northgrid}"]
  fields:
    Status: Open
- get:
    entity: SalesInvoice
    keys: [Invoice, "${inv_agrisense}"]
  fields:
    Status: Open
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: GW-EDGE, WarehouseID: WH01}
  delta: {QtyOnHand: -7.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: GW-CELL, WarehouseID: WH01}
  delta: {QtyOnHand: -3.0}
- inquire: InventorySummaryInquiry
  parameters: {InventoryID: GW-RAIL, WarehouseID: WH01}
  delta: {QtyOnHand: -2.0}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '40000'}
  delta: {EndingBalance: 4138.00}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '50000'}
  delta: {EndingBalance: 1848.00}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '11000'}
  delta: {EndingBalance: 4138.00}
- inquire: AccountSummaryInquiry
  parameters: {Ledger: ACTUAL, Period: "${current_period}"}
  match: {Account: '10100'}
  delta: {EndingBalance: 0.00}

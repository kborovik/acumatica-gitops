# acu-walk script — Major-release regression service pitch
# (lab5.ca/services/major-release-regression).
# Narrative:
#   problem (manual UAT / fire drill) → pin full product version (About form)
#   → matrix cells via --cell (full Acumatica version each) → rebuild on an
#   upgraded copy (never production) → exercise scenarios → pass/fail report.
# Drivers: matrix.yaml cells + config/** + scenario/ + acu config check / gate.
# Not a Demo Tenant Factory film — that is demo/tenant-factory-walk.yaml.
#
# Full product versions (host-true pins; About dialog form, not cell nicknames).
# Matrix act order: 25r1 → 25r2 → 26r1.
#   --cell 25r1 → Acumatica 2025 R1 Build 25.101.0153  (Default 24.200.001 + overlay)
#   --cell 25r2 → Acumatica 2025 R2 Build 25.201.0213  (Default 25.200.001)
#   --cell 26r1 → Acumatica 2026 R1 Build 26.101.0225  (Default 25.200.001)
# System Monitor / About still (beat 02) matches the shoot host. Image ref and
# default film host: 25r1 (acu-25r1-dev1). When filming another cell, change
# the 02-version-pin label to that cell's full product string above.
#
# Credentials: same .env channel as `acu` + optional data-repo matrix.yaml
#   ACU_PASSWORD required; ACU_USER defaults to admin when unset
#   ACU_BASE_URL optional when matrix.yaml cell supplies base_url
#     resolve: --url > ACU_BASE_URL > active cell base_url
#   No sticky ACU_API_VERSION — pin via --api-version or cell default_api
#   Optional acu-channel only: ACU_TENANT / ACU_TENANT_ID (not walk-target)
# Walk target: settings.tenant_name (default DEMO) + optional tenant_id
# Resolve: --tenant > settings.tenant_name > DEMO; tenant_id settings only (no default)
# Matrix: --cell selects id (omit = first cell); unknown id hard-errors
# Interp: ${tenant} ${tenant_id} ${root} ${env:NAME}
# Tenant CRUD is login-only: `acu tenant create --login …` (no --id)
#
# VO budget: ~2.4 w/s. Static frames (login, empty grids) stay ~25–30 words.
# CLI panes may run longer (scroll is the visual).
#
# Record (acu-walk ≥0.7; globals before subcommand):
#   acu-walk -f demo/major-release-regression-walk.yaml --cell 25r1 record --yes
#   acu-walk -f demo/major-release-regression-walk.yaml clean --yes
#   make record WALK=demo/major-release-regression-walk.yaml CELL=25r1
# Film host: --cell 25r1 (default film host) or --url / clear sticky ACU_BASE_URL.

version: 1
settings:
  out: demo/out
  hold: 6
  video: true
  vo: true
  ensure_captures: true
  tenant_name: GITOPS # login label; default DEMO if unset
  youtube: true # emit yt-description + yt-thumb under video/ (same take TS)
  title: "Acumatica Major-Release Regression | Pass/Fail Scenarios Before Upgrade"
  description: |
    Acumatica ships two major releases a year. Customizations, integrations,
    and non-trivial workflow carry regression risk into each one — and the
    answer today is manual click-through UAT, or nothing.

    Major-release regression path shown end-to-end:
    • Full product version pin per matrix cell (About form, not nicknames)
    • Rebuild on an upgraded copy — never production
    • Recorded business scenarios: apply → run → diff gate
    • Pass/fail report you can put your name on as a release gate

    Complements certified UAT; does not replace it. Company: LAB5 Electronics
    Inc. Service: lab5.ca/services/major-release-regression.

    #Acumatica #GitOps #RegressionTesting #ERP #MajorRelease
  # headed: false
  # width: 1600
  # height: 900
  # vo_provider: speechify
  # vo_emotion: direct

cli:
  tenant-create:
    argv: ["acu", "tenant", "create", "--login", "${tenant}"]
    write: true
    when: before-login
    ok_exits: [0]
  # Read-only preflight per matrix cell — prints claimed erp pin + live match.
  # Labels/VO use full About-dialog product strings (see header table).
  # Order: 25r1 → 25r2 → 26r1 (beats 03–05).
  check-25r1:
    argv: ["acu", "--cell", "25r1", "config", "check"]
    write: false
    when: interleaved
    ok_exits: [0, 1]
  check-25r2:
    argv: ["acu", "--cell", "25r2", "config", "check"]
    write: false
    when: interleaved
    ok_exits: [0, 1]
  check-26r1:
    argv: ["acu", "--cell", "26r1", "config", "check"]
    write: false
    when: interleaved
    ok_exits: [0, 1]
  acu-apply:
    argv: ["acu", "apply", "config/"]
    tenant_flag: true
    write: true
    when: interleaved
    after: [relogin]
    ok_exits: [0]
  acu-run:
    argv: ["acu", "run", "scenario/"]
    tenant_flag: true
    write: true
    when: interleaved
    ok_exits: [0]
  acu-diff:
    argv: ["acu", "diff", "config/"]
    tenant_flag: true
    write: false
    when: interleaved
    ok_exits: [0, 2]

beats:
  # ===========================================================================
  # ACT 1 — THE WAY IT'S DONE NOW
  # ===========================================================================

  # Camera: sign-in page, clean — no terminal pane. KEEP SHORT (static frame).
  # Friction only: two majors a year, manual UAT or nothing. The gate answer
  # starts at beat 01.
  - id: "00-var-problem"
    screen: login
    vo: >
      Acumatica ships two major releases a year. Every tenant with
      customizations or integrations carries regression risk — and the answer
      today is manual click-through UAT, or nothing.

  # ===========================================================================
  # ACT 2 — VERSION (pin the product, not a nickname)
  # ===========================================================================

  # Camera: empty tenant create log over sign-in. Target is an upgraded copy,
  # never production — stated here so rebuild never sounds like live cutover.
  - id: "01-cli-tenant-create"
    cli: tenant-create
    backdrop: login
    speed: 40
    max_lines: 200
    vo: >
      Start on an upgraded copy, never production. One command creates a clean
      tenant on the host you are certifying — empty, ready for the seed.

  # Camera: System Monitor (SM201530) — same surface as the About dialog shot.
  # Label carries the full product string (About form). Default film host 25r1;
  # swap the label when shooting 26r1 or 25r2 (see header table).
  - id: "02-version-pin"
    screen: SM201530
    label: "Acumatica 2025 R1 Build 25.101.0153"
    vo: >
      Pin the release first. About Acumatica shows the full product version —
      year, major, and build — not a nickname. This host is twenty-twenty-five
      R-one, build twenty-five one oh one oh one five three.

  # ===========================================================================
  # ACT 3 — MATRIX (full version for each --cell)
  # ===========================================================================

  # Three cells, three full product strings. CLI is `acu --cell <id> config check`.
  # Order: 25r1 → 25r2 → 26r1. Labels are the About-dialog form; VO names cell
  # id + full product once each. ok_exits includes 1 so a down lab host does
  # not hard-stop the film; the visual is the pin line either way.
  - id: "03-cli-check-25r1"
    cli: check-25r1
    backdrop: SM201530
    speed: 40
    max_lines: 80
    label: "Acumatica 2025 R1 Build 25.101.0153"
    vo: >
      Cell twenty-five R-one. Acumatica twenty-twenty-five R-one, build
      twenty-five one oh one oh one five three — Default twenty-four two
      hundred, with the pin overlay when the host needs it.

  - id: "04-cli-check-25r2"
    cli: check-25r2
    backdrop: SM201530
    speed: 40
    max_lines: 80
    label: "Acumatica 2025 R2 Build 25.201.0213"
    vo: >
      Cell twenty-five R-two. Acumatica twenty-twenty-five R-two, build
      twenty-five two oh one oh two one three. Pin and where live in
      matrix.yaml — selected with dash dash cell.

  - id: "05-cli-check-26r1"
    cli: check-26r1
    backdrop: SM201530
    speed: 40
    max_lines: 80
    label: "Acumatica 2026 R1 Build 26.101.0225"
    vo: >
      Cell twenty-six R-one. Full product: Acumatica twenty-twenty-six R-one,
      build twenty-six one oh one oh two two five. Same seed tree, three
      hosts, full version pinned on every cell.

  # ===========================================================================
  # ACT 4 — REBUILD (version → rebuild)
  # ===========================================================================

  # Camera: Companies list before apply. ready:false — virgin tenant has no rows.
  - id: "06-empty-tenant"
    screen: CS1015PL
    ready: false
    vo: >
      Zero companies on the copy. No ledger, no items, no customers. The
      upgrade host is ready; the seed has not landed yet.

  # Camera: apply scroll. Volume is the point — do not speed-ramp past the proof.
  - id: "07-cli-apply"
    cli: acu-apply
    backdrop: CS1015PL
    speed: 55
    max_lines: 400
    vo: >
      Rebuild from the repo. Apply writes company, chart of accounts, ledger,
      warehouse, parts, kits, vendors, customers — dependency order, every
      write an upsert. Same tree on every major.

  - id: "08-company"
    screen: CS1015PL
    highlight: ["LAB5 Electronics Inc."]
    label: "rebuilt on upgraded copy"
    vo: >
      There's the company. Empty one command ago. Nobody clicked the wizard —
      the upgraded copy now matches the seed you review in git.

  # ===========================================================================
  # ACT 5 — EXERCISE (rebuild → exercise)
  # ===========================================================================

  # Full gate path: bare `acu run scenario/` (capital, buy, build, sell, collect).
  # Backdrop is the sales-order list before the run paints documents.
  - id: "09-cli-run"
    cli: acu-run
    backdrop: SO3010PL
    speed: 45
    max_lines: 400
    vo: >
      Exercise the business path. Recorded scenarios fund the bank, buy
      components, assemble kits, sell, and collect — each step checks inventory
      and ledger deltas. Failures name the step, not a customer on the phone.

  # Money shot after the run — mixed AR / cash is evidence the scenarios ran.
  # Numbers are cold-run only (same V11 cold ending as tenant-factory).
  - id: "10-cash-position"
    screen: GL401000
    highlight: ["Checking Account"]
    row: true
    label: "scenario pass evidence"
    vo: >
      Scenarios passed. Checking and open A-R land where the expects say —
      linked history on the upgraded copy, not a hand-keyed demo balance.

  # ===========================================================================
  # ACT 6 — REPORT (exercise → report)
  # ===========================================================================

  - id: "11-cli-diff"
    cli: acu-diff
    backdrop: GL202500
    speed: 55
    max_lines: 400
    vo: >
      Last gate. Diff compares the live tenant back to the repo. Clean means
      scenarios did not dirty configuration. Exit zero is pass; drift is fail —
      a report you can put your name on.

  # Landing still — configuration surface, clean gate claim.
  - id: "12-gate-report"
    screen: GL202500
    label: "pass / fail per tenant"
    vo: >
      Version, rebuild, exercise, report. Same loop under every major. Put your
      name on the report as the release gate — or resell it under your brand
      when the format is ready. Complements certified U-A-T; never replaces it.

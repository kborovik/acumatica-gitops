# Demo users (SM201010). Role membership via Roles detail is not durable on
# Bootstrap/1.4.0 cold PUT (live GET returns Roles: []); identity seed only.
# SO Admin role is seeded in 90-roles.yaml for manual assign when needed.
entity: User
key: Username
endpoint: bootstrap
records:
- Username: soadmin
  FirstName: SO
  LastName: Admin
  Email: soadmin@example.com
  IsApproved: true
  PasswordNeverExpires: true
  PasswordChangeOnNextLogin: false
- Username: apadmin
  FirstName: AP
  LastName: Admin
  Email: apadmin@example.com
  IsApproved: true
  PasswordNeverExpires: true
  PasswordChangeOnNextLogin: false
- Username: aradmin
  FirstName: AR
  LastName: Admin
  Email: aradmin@example.com
  IsApproved: true
  PasswordNeverExpires: true
  PasswordChangeOnNextLogin: false

# Customers (AR303000) via the Default endpoint - reachable once AR
# preferences exist (60-ar-preferences.yaml; P1 probe 500'd before it).
# Seven B2B buyers of the gateway kits. Terms/AR accounts and the cash
# discount default from customer class B2B (71-customer-classes.yaml) -
# class-driven GL stays on the class so class changes propagate.
# MainContact/Address (Country required at insert - T65) carries full
# street/city/state/postal + company Email/Phone1. PrimaryContact is
# the named buyer contact (First/Last/Email/Phone/JobTitle) so AR303000
# Contacts tab is non-empty for the pitch.
#
# APPLY ORDER (dir expansion sorts *.yaml alphabetically; numbered
# prefixes encode order): after 71-customer-classes.yaml.
entity: Customer
key: CustomerID
